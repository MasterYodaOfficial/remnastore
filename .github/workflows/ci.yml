name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  release-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Russian release description
        env:
          CHECK_RELEASE_BASE: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' }}
        run: |
          if [[ "$CHECK_RELEASE_BASE" == "true" ]]; then
            python scripts/release.py check --base-ref origin/main
          else
            python scripts/release.py check
          fi
      - name: Test release publication and recovery
        run: python -m unittest discover -s scripts/tests -p 'test_*.py'

  python-quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: remnastore_test
          POSTGRES_USER: remnastore_test
          POSTGRES_PASSWORD: local-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U remnastore_test -d remnastore_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # API tests replace sessions per suite, but imports still need a parseable URL in CI.
      DATABASE_URL: sqlite+aiosqlite:///./ci-python-quality.sqlite3
      TEST_POSTGRES_URL: postgresql+asyncpg://remnastore_test:local-ci-only@127.0.0.1:5432/remnastore_test
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install Python dependencies
        run: uv sync --frozen --group dev

      - name: Run ruff check
        run: uv run --group dev ruff check apps/api apps/bot common scripts

      - name: Run ruff format check
        run: uv run --group dev ruff format --check apps/api apps/bot common scripts

      - name: Run PostgreSQL subscription grant regression
        run: PYTHONPATH=apps/api uv run --no-sync python -m unittest discover -s apps/api/tests -p 'test_subscription_grant_postgres.py'

      - name: Run Python tests
        run: ./scripts/test.sh all

      - name: Enforce API critical coverage
        run: ./scripts/coverage.sh api-critical --fail-under 70

  web-quality:
    # Playwright 1.56.1 supports Ubuntu 24.04, not newer ubuntu-latest images.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        run: npm ci

      - name: Run web lint
        run: npm run lint

      - name: Run web tests
        run: npm run test

      - name: Run web typecheck
        run: npm run typecheck

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run web browser smoke
        run: npm run test:e2e

      - name: Upload web Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-playwright-artifacts
          path: |
            apps/web/test-results
            apps/web/playwright-report
          if-no-files-found: ignore

      - name: Build web
        run: npm run build

  admin-quality:
    # Keep browser dependencies on an OS supported by the pinned Playwright.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/admin
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json

      - name: Install admin dependencies
        run: npm ci

      - name: Run admin lint
        run: npm run lint

      - name: Run admin tests
        run: npm run test

      - name: Run admin typecheck
        run: npm run typecheck

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run admin browser smoke
        run: npm run test:e2e

      - name: Upload admin Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: admin-playwright-artifacts
          path: |
            apps/admin/test-results
            apps/admin/playwright-report
          if-no-files-found: ignore

      - name: Build admin
        run: npm run build

  docker-release:
    needs: [release-quality, python-quality, web-quality, admin-quality]
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    permissions:
      contents: write
    uses: ./.github/workflows/docker-publish.yml
    with:
      publish: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
