name: Docker Publish

on:
  workflow_call:
    inputs:
      publish:
        type: boolean
        default: false
    secrets:
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false

permissions:
  contents: read

env:
  DOCKERHUB_REPOSITORY: masteryodaofficial/remnastorepy

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check release version and notes
        id: release
        env:
          PUBLISH: ${{ inputs.publish }}
        run: |
          if [[ "$PUBLISH" == "true" ]]; then
            python scripts/release.py prepare --publish
          else
            python scripts/release.py prepare
          fi

  build:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        component: [api, bot, web, admin]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Prepare staging tag
        id: image
        env:
          COMPONENT: ${{ matrix.component }}
        run: echo "tag=${DOCKERHUB_REPOSITORY}:${COMPONENT}-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - name: Build image without publishing
        uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: .
          file: ops/docker/${{ matrix.component }}.Dockerfile
          push: false
          provenance: false
          tags: ${{ steps.image.outputs.tag }}
          build-args: |
            APP_VERSION=${{ needs.prepare.outputs.version }}
            APP_REVISION=${{ github.sha }}
          outputs: type=docker,dest=${{ runner.temp }}/${{ matrix.component }}.tar
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
      - name: Save image for release publication
        if: inputs.publish
        uses: actions/upload-artifact@v4
        with:
          name: release-image-${{ matrix.component }}
          path: ${{ runner.temp }}/${{ matrix.component }}.tar
          compression-level: 0
          retention-days: 3

  publish:
    needs: [prepare, build]
    if: >-
      inputs.publish && github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: remnastore-release-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: docker/setup-buildx-action@v3
      - uses: actions/download-artifact@v4
        with:
          pattern: release-image-*
          path: ${{ runner.temp }}/release-images
          merge-multiple: true
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish images and Russian GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_IMAGES: ${{ runner.temp }}/release-images
        run: python scripts/release.py publish --artifacts "$RELEASE_IMAGES"
